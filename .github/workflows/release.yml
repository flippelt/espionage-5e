name: Release

# Publishing a GitHub Release (tag vX.Y.Z) builds the zip from the YAML
# sources, attaches it plus a self-referencing module.json to the tag, and
# refreshes the moving `latest` manifest. If FVTT_RELEASE_TOKEN is set, the
# version is also registered with the Foundry Package Release API.
#
# Bump `version` and `download` in module.json before tagging.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Foundry API dry-run (validate without publishing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FVTT_RELEASE_TOKEN: ${{ secrets.FVTT_RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="$(jq -r '.version' module.json)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::module.json version $VERSION does not match tag $TAG"; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "id=$(jq -r '.id' module.json)"
            echo "version=$VERSION"
            echo "minimum=$(jq -r '.compatibility.minimum // ""' module.json)"
            echo "verified=$(jq -r '.compatibility.verified // ""' module.json)"
            echo "maximum=$(jq -r '.compatibility.maximum // ""' module.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build module zip
        run: npm run build

      - name: Build self-referencing manifest for this tag
        run: |
          mkdir -p rel
          jq --arg u "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/module.json" \
            '.manifest = $u' module.json > rel/module.json

      - name: Attach assets to the release
        run: gh release upload "${{ steps.meta.outputs.tag }}" rel/module.json "dist/${{ steps.meta.outputs.id }}.zip" --clobber --repo "${{ github.repository }}"

      - name: Refresh moving 'latest' manifest
        run: |
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create latest --title "Latest manifest" --notes "Moving auto-update channel: module.json always points at the newest release." --repo "${{ github.repository }}"
          gh release upload latest module.json --clobber --repo "${{ github.repository }}"

      - name: Register with Foundry Package Release API
        if: ${{ env.FVTT_RELEASE_TOKEN != '' }}
        run: |
          payload=$(jq -n \
            --arg id "${{ steps.meta.outputs.id }}" \
            --argjson dry ${{ inputs.dry_run || false }} \
            --arg version "${{ steps.meta.outputs.version }}" \
            --arg manifest "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/module.json" \
            --arg notes "https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}" \
            --arg min "${{ steps.meta.outputs.minimum }}" \
            --arg verified "${{ steps.meta.outputs.verified }}" \
            --arg max "${{ steps.meta.outputs.maximum }}" \
            '{id:$id, "dry-run":$dry, release:{version:$version, manifest:$manifest, notes:$notes, compatibility:{minimum:$min, verified:$verified, maximum:$max}}}')
          token=$(printf '%s' "$FVTT_RELEASE_TOKEN" | tr -d '[:space:]')
          http=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Authorization: $token" -H "Content-Type: application/json" -d "$payload")
          echo "HTTP $http"; cat resp.json; echo
          if [ "$http" -ge 400 ]; then
            if grep -q "unique_together\|already exists" resp.json; then
              echo "::warning::Version already registered on Foundry."; exit 0
            fi
            exit 1
          fi
